<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nostalgia Constellations — Color Combinations</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #05060e;
  color: #e8e4d9;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  min-height: 100vh;
}

/* grain overlay */
body::after {
  content:'';
  position:fixed; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:999;
  opacity: 0.5;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 4rem 3rem 6rem;
}

header {
  margin-bottom: 4rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid rgba(232,228,217,0.07);
}

.eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(232,228,217,0.35);
  margin-bottom: 0.6rem;
}

h1 {
  font-size: 2rem;
  font-weight: 300;
  letter-spacing: -0.01em;
}
h1 em { font-style: italic; color: #c9a96e; }

/* SOURCE LEGEND */
.source-row {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-top: 1.5rem;
}
.source-pill {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(232,228,217,0.45);
}
.source-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* SECTION */
.section {
  margin-bottom: 4rem;
}
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(232,228,217,0.25);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.section-label::after {
  content:'';
  flex:1;
  height:1px;
  background: rgba(232,228,217,0.06);
}

/* ORB GRID */
.orb-grid {
  display: grid;
  gap: 2rem;
}
.orb-grid.pairs    { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.orb-grid.singles  { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.orb-grid.triplets { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

/* ORB CARD */
.orb-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
  cursor: default;
}

.orb-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  transition: transform 0.3s ease;
}
.orb-grid.singles .orb-wrap {
  width: 110px;
  height: 110px;
}
.orb-grid.triplets .orb-wrap {
  width: 170px;
  height: 170px;
}

.orb-card:hover .orb-wrap { transform: scale(1.05); }

canvas.orb-canvas {
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

.orb-names {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
}
.orb-name {
  font-family: 'DM Mono', monospace;
  font-size: 0.52rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(232,228,217,0.45);
  text-align: center;
}
.orb-name span {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 0.3rem;
  vertical-align: middle;
  margin-bottom: 1px;
}

.dl-btn {
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  transform: translateY(4px);
  background: none;
  border: 1px solid rgba(232,228,217,0.18);
  color: rgba(232,228,217,0.5);
  font-family: 'DM Mono', monospace;
  font-size: 0.48rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
  border-radius: 0;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: opacity 0.2s, transform 0.2s, border-color 0.2s, color 0.2s;
}

.dl-btn svg {
  width: 8px; height: 8px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.dl-btn:hover {
  border-color: rgba(232,228,217,0.45);
  color: rgba(232,228,217,0.85);
}

.orb-card:hover .dl-btn {
  opacity: 1;
  transform: translateY(0);
}

.dl-all-wrap {
  display: flex;
  justify-content: flex-end;
  margin-top: 1.5rem;
}

.dl-all-btn {
  background: none;
  border: 1px solid rgba(232,228,217,0.25);
  color: rgba(232,228,217,0.65);
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0.55rem 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}

.dl-all-btn:hover {
  border-color: rgba(232,228,217,0.55);
  color: rgba(232,228,217,0.95);
  background: rgba(232,228,217,0.04);
}

.dl-all-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.dl-all-btn svg {
  width: 9px; height: 9px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.progress-bar-wrap {
  display: none;
  align-items: center;
  gap: 0.8rem;
  margin-top: 1rem;
  justify-content: flex-end;
}
.progress-bar-wrap.visible { display: flex; }
.progress-track {
  width: 180px;
  height: 1px;
  background: rgba(232,228,217,0.1);
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: rgba(232,228,217,0.4);
  width: 0%;
  transition: width 0.15s ease;
}
.progress-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.5rem;
  letter-spacing: 0.12em;
  color: rgba(232,228,217,0.3);
  white-space: nowrap;
}

</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow">Nostalgia Constellations · Wellbeing Color System</div>
    <h1><em>Color</em> Combinations</h1>
    <div class="source-row">
      <div class="source-pill"><div class="source-dot" style="background:#d4706a"></div>Anxious</div>
      <div class="source-pill"><div class="source-dot" style="background:#d94fa0"></div>Bitterness</div>
      <div class="source-pill"><div class="source-dot" style="background:#e8c84a"></div>Joyful</div>
      <div class="source-pill"><div class="source-dot" style="background:#4a4aaa"></div>Melancholy</div>
      <div class="source-pill"><div class="source-dot" style="background:#a0722a"></div>Nostalgic</div>
      <div class="source-pill"><div class="source-dot" style="background:#2a8a8a"></div>Peaceful</div>
    </div>
    <div class="dl-all-wrap">
      <button class="dl-all-btn" id="dl-all-btn">
        <svg viewBox="0 0 10 10"><polyline points="5,1 5,7"/><polyline points="2.5,5 5,7.5 7.5,5"/><line x1="1.5" y1="9" x2="8.5" y2="9"/></svg>
        Download all 41
      </button>
    </div>
    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-label" id="progress-label">0 / 41</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </header>

  <!-- SINGLES -->
  <div class="section">
    <div class="section-label">Single colors · 6</div>
    <div class="orb-grid singles" id="singles-grid"></div>
  </div>

  <!-- PAIRS -->
  <div class="section">
    <div class="section-label">Two-color combinations · 15 pairs</div>
    <div class="orb-grid pairs" id="pairs-grid"></div>
  </div>

  <!-- TRIPLETS -->
  <div class="section">
    <div class="section-label">Three-color combinations · 20 triplets</div>
    <div class="orb-grid triplets" id="triplets-grid"></div>
  </div>

</div>

<script>
const EMOTIONS = [
  { id: 'anxious',    label: 'Anxious',    colors: ['#d4706a','#e89090','#b04848'] },
  { id: 'bitterness', label: 'Bitterness', colors: ['#d94fa0','#8b3a9e','#e066b4'] },
  { id: 'joyful',    label: 'Joyful',     colors: ['#e8c84a','#f0d870','#c0a020'] },
  { id: 'melancholy',label: 'Melancholy', colors: ['#4a4aaa','#6868cc','#282888'] },
  { id: 'nostalgic', label: 'Nostalgic',  colors: ['#a0722a','#c09040','#784e10'] },
  { id: 'peaceful',  label: 'Peaceful',   colors: ['#2a8a8a','#4ab8b8','#1a5858'] },
];

// dot colors for legend
const DOT = {
  anxious:    '#d4706a',
  bitterness: '#d94fa0',
  joyful:     '#e8c84a',
  melancholy: '#4a4aaa',
  nostalgic:  '#a0722a',
  peaceful:   '#2a8a8a',
};

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function drawOrb(canvas, emotionObjs, size) {
  const dpr = window.devicePixelRatio || 2;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = size/2, cy = size/2, r = size/2 - 2;

  // black bg
  ctx.fillStyle = '#05060e';
  ctx.fillRect(0,0,size,size);

  // outer glow halo
  const halo = ctx.createRadialGradient(cx,cy,r*0.75,cx,cy,r*1.08);
  halo.addColorStop(0, 'rgba(255,255,255,0)');
  halo.addColorStop(0.7,'rgba(255,255,255,0.06)');
  halo.addColorStop(1,  'rgba(255,255,255,0.22)');
  ctx.beginPath(); ctx.arc(cx,cy,r*1.08,0,Math.PI*2);
  ctx.fillStyle = halo; ctx.fill();

  // clip to circle
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();

  const n = emotionObjs.length;

  if (n === 1) {
    const e = emotionObjs[0];
    const g = ctx.createRadialGradient(cx*0.8,cy*0.7,0,cx,cy,r);
    g.addColorStop(0, e.colors[1]+'ee');
    g.addColorStop(0.55, e.colors[0]+'cc');
    g.addColorStop(1,   e.colors[2]+'aa');
    ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  }

  if (n === 2) {
    const [a,b] = emotionObjs;
    // base layer - blend
    const g0 = ctx.createRadialGradient(cx*0.6,cy*0.6,0,cx,cy,r);
    g0.addColorStop(0, a.colors[0]+'dd');
    g0.addColorStop(0.5, b.colors[0]+'bb');
    g0.addColorStop(1, a.colors[2]+'99');
    ctx.fillStyle = g0; ctx.fillRect(0,0,size,size);

    // second blob offset
    const g1 = ctx.createRadialGradient(cx*1.3,cy*1.2,0,cx*1.1,cy*1.1,r*0.7);
    g1.addColorStop(0, b.colors[1]+'cc');
    g1.addColorStop(0.6, b.colors[0]+'66');
    g1.addColorStop(1, 'transparent');
    ctx.fillStyle = g1; ctx.fillRect(0,0,size,size);

    // rim accent
    const rim = ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,r);
    rim.addColorStop(0,'transparent');
    rim.addColorStop(0.75,'transparent');
    rim.addColorStop(1, a.colors[2]+'55');
    ctx.fillStyle=rim; ctx.fillRect(0,0,size,size);
  }

  if (n === 3) {
    const [a,b,c] = emotionObjs;
    // base wash
    const g0 = ctx.createRadialGradient(cx*0.5,cy*0.5,0,cx,cy,r);
    g0.addColorStop(0, a.colors[0]+'cc');
    g0.addColorStop(0.45, b.colors[0]+'aa');
    g0.addColorStop(1, c.colors[2]+'99');
    ctx.fillStyle=g0; ctx.fillRect(0,0,size,size);

    // b blob
    const g1 = ctx.createRadialGradient(cx*1.25,cy*0.7,0,cx*1.1,cy*0.8,r*0.65);
    g1.addColorStop(0, b.colors[1]+'bb');
    g1.addColorStop(0.5, b.colors[0]+'55');
    g1.addColorStop(1,'transparent');
    ctx.fillStyle=g1; ctx.fillRect(0,0,size,size);

    // c blob
    const g2 = ctx.createRadialGradient(cx*0.8,cy*1.35,0,cx*0.9,cy*1.2,r*0.6);
    g2.addColorStop(0, c.colors[0]+'bb');
    g2.addColorStop(0.5, c.colors[1]+'55');
    g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2; ctx.fillRect(0,0,size,size);

    // rim
    const rim = ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,r);
    rim.addColorStop(0,'transparent');
    rim.addColorStop(0.7,'transparent');
    rim.addColorStop(1, a.colors[2]+'44');
    ctx.fillStyle=rim; ctx.fillRect(0,0,size,size);
  }

  // overlapping translucent inner circles (the design's signature element)
  const numCircles = n === 1 ? 2 : n === 2 ? 3 : 4;
  for (let i = 0; i < numCircles; i++) {
    const e = emotionObjs[i % n];
    const angle = (i / numCircles) * Math.PI * 2 + 0.4;
    const dist = r * 0.28;
    const ox = cx + Math.cos(angle) * dist * 0.5;
    const oy = cy + Math.sin(angle) * dist * 0.6;
    const cr = r * (0.42 + i * 0.06);
    const cg = ctx.createRadialGradient(ox,oy,0,ox,oy,cr);
    cg.addColorStop(0,'rgba(0,0,0,0.18)');
    cg.addColorStop(0.6,'rgba(0,0,0,0.08)');
    cg.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.arc(ox,oy,cr,0,Math.PI*2);
    ctx.fillStyle=cg; ctx.fill();
    ctx.beginPath(); ctx.arc(ox,oy,cr,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=0.5; ctx.stroke();
  }

  // star diffraction spike
  const numSpikes = n === 3 ? 8 : n === 2 ? 6 : 4;
  const spikeCx = cx * 1.1;
  const spikeCy = cy * 0.95;
  for (let i = 0; i < numSpikes; i++) {
    const a = (i / numSpikes) * Math.PI * 2;
    const len = r * (i % 2 === 0 ? 0.45 : 0.22);
    const g = ctx.createLinearGradient(
      spikeCx, spikeCy,
      spikeCx + Math.cos(a)*len, spikeCy + Math.sin(a)*len
    );
    g.addColorStop(0,'rgba(255,255,255,0.75)');
    g.addColorStop(0.4,'rgba(255,255,255,0.2)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.moveTo(spikeCx,spikeCy);
    ctx.lineTo(spikeCx + Math.cos(a)*len, spikeCy + Math.sin(a)*len);
    ctx.strokeStyle=g;
    ctx.lineWidth = i%2===0 ? 1.2 : 0.6;
    ctx.stroke();
  }

  // central glow
  const cgl = ctx.createRadialGradient(spikeCx,spikeCy,0,spikeCx,spikeCy,r*0.18);
  cgl.addColorStop(0,'rgba(255,255,255,0.55)');
  cgl.addColorStop(0.4,'rgba(255,255,255,0.12)');
  cgl.addColorStop(1,'transparent');
  ctx.fillStyle=cgl; ctx.fillRect(0,0,size,size);

  // grain noise
  const imgd = ctx.getImageData(0,0,size,size);
  const data = imgd.data;
  for (let i=0;i<data.length;i+=4) {
    const n = (Math.random()-0.5)*28;
    data[i]  = Math.max(0,Math.min(255,data[i]+n));
    data[i+1]= Math.max(0,Math.min(255,data[i+1]+n));
    data[i+2]= Math.max(0,Math.min(255,data[i+2]+n));
  }
  ctx.putImageData(imgd,0,0);

  ctx.restore();
}

// Export version: draws orb on transparent background
function drawOrbTransparent(emotionObjs, size) {
  const exportCanvas = document.createElement('canvas');
  // Draw on a temp canvas with black bg first
  drawOrb(exportCanvas, emotionObjs, size);

  // Now composite onto a fresh transparent canvas with circular mask
  const out = document.createElement('canvas');
  out.width = size;
  out.height = size;
  const ctx2 = out.getContext('2d');

  const cx = size / 2, cy = size / 2, r = size / 2 - 2;

  // Draw circular clip path
  ctx2.beginPath();
  ctx2.arc(cx, cy, r, 0, Math.PI * 2);
  ctx2.clip();

  // Draw the rendered orb into the clipped circle
  ctx2.drawImage(exportCanvas, 0, 0, size, size);

  return out;
}

function makeOrbCard(emotionObjs, gridEl, size) {
  const card = document.createElement('div');
  card.className = 'orb-card';

  const wrap = document.createElement('div');
  wrap.className = 'orb-wrap';

  const canvas = document.createElement('canvas');
  canvas.className = 'orb-canvas';
  wrap.appendChild(canvas);

  const names = document.createElement('div');
  names.className = 'orb-names';

  emotionObjs.forEach(e => {
    const d = document.createElement('div');
    d.className = 'orb-name';
    d.innerHTML = `<span style="background:${DOT[e.id]}"></span>${e.label}`;
    names.appendChild(d);
  });

  // download button
  const dlBtn = document.createElement('button');
  dlBtn.className = 'dl-btn';
  dlBtn.innerHTML = `<svg viewBox="0 0 10 10"><polyline points="5,1 5,7"/><polyline points="2.5,5 5,7.5 7.5,5"/><line x1="1.5" y1="9" x2="8.5" y2="9"/></svg>Download`;
  dlBtn.addEventListener('click', () => {
    const exportCanvas = drawOrbTransparent(emotionObjs, 1200);
    const filename = emotionObjs.map(e => e.label.toLowerCase()).join('-') + '.png';
    const link = document.createElement('a');
    link.download = filename;
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
  });

  card.appendChild(wrap);
  card.appendChild(names);
  card.appendChild(dlBtn);
  gridEl.appendChild(card);

  drawOrb(canvas, emotionObjs, size);
}

// Generate singles
const singlesGrid = document.getElementById('singles-grid');
for (let i = 0; i < EMOTIONS.length; i++) {
  makeOrbCard([EMOTIONS[i]], singlesGrid, 110);
}

// Generate pairs (C(6,2) = 15)
const pairsGrid = document.getElementById('pairs-grid');
for (let i = 0; i < EMOTIONS.length; i++) {
  for (let j = i+1; j < EMOTIONS.length; j++) {
    makeOrbCard([EMOTIONS[i], EMOTIONS[j]], pairsGrid, 140);
  }
}

// Generate triplets (C(6,3) = 20)
const tripletsGrid = document.getElementById('triplets-grid');
for (let i = 0; i < EMOTIONS.length; i++) {
  for (let j = i+1; j < EMOTIONS.length; j++) {
    for (let k = j+1; k < EMOTIONS.length; k++) {
      makeOrbCard([EMOTIONS[i], EMOTIONS[j], EMOTIONS[k]], tripletsGrid, 170);
    }
  }
}

// ── Download All ──────────────────────────────────────────────
// Collect every combination: singles + pairs + triplets
const ALL_COMBOS = [];
// singles
for (let i = 0; i < EMOTIONS.length; i++) {
  ALL_COMBOS.push([EMOTIONS[i]]);
}
// pairs
for (let i = 0; i < EMOTIONS.length; i++)
  for (let j = i+1; j < EMOTIONS.length; j++)
    ALL_COMBOS.push([EMOTIONS[i], EMOTIONS[j]]);
// triplets
for (let i = 0; i < EMOTIONS.length; i++)
  for (let j = i+1; j < EMOTIONS.length; j++)
    for (let k = j+1; k < EMOTIONS.length; k++)
      ALL_COMBOS.push([EMOTIONS[i], EMOTIONS[j], EMOTIONS[k]]);

document.getElementById('dl-all-btn').addEventListener('click', async function() {
  const btn = this;
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');
  const total = ALL_COMBOS.length;

  btn.disabled = true;
  progressWrap.classList.add('visible');

  for (let idx = 0; idx < total; idx++) {
    const combo = ALL_COMBOS[idx];
    const exportCanvas = drawOrbTransparent(combo, 1200);
    const filename = combo.map(e => e.label.toLowerCase()).join('-') + '.png';

    await new Promise(resolve => {
      exportCanvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); resolve(); }, 80);
      }, 'image/png');
    });

    // update progress
    const pct = Math.round(((idx + 1) / total) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `${idx + 1} / ${total}`;

    // small delay so browser doesn't get overwhelmed
    await new Promise(r => setTimeout(r, 120));
  }

  btn.disabled = false;
  progressLabel.textContent = `✓ ${total} downloaded`;
  setTimeout(() => {
    progressWrap.classList.remove('visible');
    progressFill.style.width = '0%';
    progressLabel.textContent = '0 / ' + total;
  }, 3000);
});
</script>
</body>
</html>
